<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c11">
<title>Seri · Alışkanlık Macerası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c11; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --ink:#eef0f6; --muted:#8a90a2; --dim:#5c6274; --soft:rgba(255,255,255,.06);
  --acc:#7c6cff; --acc2:#22d3ee;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --gf:'Space Grotesk','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark;background:var(--bg)}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}
[hidden]{display:none!important}

/* arka plan */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(1100px 560px at 85% -10%,rgba(124,108,255,.16),transparent 60%),radial-gradient(900px 520px at -10% 110%,rgba(34,211,238,.10),transparent 60%),var(--bg)}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 72%)}
.bg span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;animation:float 26s ease-in-out infinite}
.bg span:nth-child(1){width:340px;height:340px;background:#7c6cff;top:6%;right:-90px}
.bg span:nth-child(2){width:300px;height:300px;background:#22d3ee;bottom:6%;left:-90px;animation-delay:-9s}
.bg span:nth-child(3){width:220px;height:220px;background:#ff6b4a;top:48%;left:48%;opacity:.12;animation-delay:-17s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,24px) scale(.94)}}

.wrap{max-width:1040px;margin:0 auto;padding:0 18px calc(120px + env(safe-area-inset-bottom))}

/* üst bar */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;margin:0 -18px 16px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:rgba(10,12,17,.72);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--gf);font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ff6b4a,#7c6cff);box-shadow:0 8px 22px -8px rgba(255,107,74,.7),inset 0 1px 0 rgba(255,255,255,.3);font-size:16px}
.logo b{display:inline-block;animation:flick 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.1)}}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:15px;display:grid;place-items:center;transition:background .2s,transform .15s}
.iconbtn:active{transform:scale(.92)}

/* profil */
.player{display:flex;align-items:center;gap:18px;padding:18px;border-radius:24px;background:linear-gradient(135deg,rgba(124,108,255,.14),rgba(34,211,238,.05) 60%,rgba(255,255,255,.02));border:1px solid var(--line2);margin-bottom:28px;position:relative}
.emblem{width:76px;height:76px;position:relative;flex-shrink:0;cursor:pointer;transition:filter .4s}
.emblem svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.emblem circle{fill:none;stroke-width:6;stroke-linecap:round}
.emblem .et{stroke:rgba(255,255,255,.08)}
.emblem .ep{stroke:url(#xpg);transition:stroke-dashoffset 1s var(--ease)}
.elv{position:absolute;inset:10px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2a2f3d,#13161e);display:grid;place-items:center;align-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.elv small{font-size:8.5px;font-weight:700;letter-spacing:.16em;color:var(--muted)}
.elv span{font-family:var(--gf);font-size:23px;font-weight:700;line-height:1}
.emblem.happy{filter:drop-shadow(0 0 14px rgba(124,108,255,.75))}
.emblem.happy .elv{animation:glow 2.2s ease-in-out infinite}
.emblem.sleepy{filter:saturate(.35) brightness(.85)}
.emblem.wiggle{animation:spin .7s var(--ease)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 0 4px rgba(124,108,255,.18)}}
.pinfo{flex:1;min-width:0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ptitle{font-family:var(--gf);font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.todaytxt{font-weight:600;font-size:12px;padding:5px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.todaytxt:empty{display:none}
.xpwrap{height:8px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.xpbar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7c6cff,#22d3ee);box-shadow:0 0 12px rgba(124,108,255,.6);transition:width .9s var(--ease);position:relative;overflow:hidden}
.xpbar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shine 2.6s infinite;transform:translateX(-100%)}
@keyframes shine{to{transform:translateX(100%)}}
.xptext{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bubble{position:absolute;left:108px;top:8px;background:#eef0f6;color:#0a0c11;font-weight:600;font-size:12px;padding:7px 11px;border-radius:10px;opacity:0;transform:translateY(6px) scale(.96);transition:.3s var(--ease);pointer-events:none;white-space:nowrap;z-index:3}
.bubble.show{opacity:1;transform:none}

.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}
.sechead h2{font-family:var(--gf);font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

/* kartlar */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{--hc:#ff6b4a;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:20px;padding:16px;position:relative;transition:transform .3s var(--ease),border-color .3s,box-shadow .3s;isolation:isolate}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px 170px at 0% 0%,color-mix(in srgb,var(--hc) 13%,transparent),transparent 70%);z-index:-1;pointer-events:none}
.card.enter{animation:pop .5s var(--ease) both}
.card.done{border-color:color-mix(in srgb,var(--hc) 35%,transparent)}
.card.master{border-color:rgba(245,176,65,.45);background:linear-gradient(180deg,rgba(245,176,65,.10),rgba(255,255,255,.015))}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.top{display:flex;align-items:center;gap:12px;cursor:pointer}
.emoji{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--hc) 15%,transparent);border:1px solid color-mix(in srgb,var(--hc) 30%,transparent);flex-shrink:0;transition:transform .4s var(--spring)}
.info{flex:1;min-width:0}
.name{font-family:var(--gf);font-weight:600;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.sub .fl{color:#ffb38a;font-weight:600}
.ring{width:54px;height:54px;position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg);display:block;width:54px;height:54px}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.07)}
.ring .pr{stroke:var(--hc);transition:stroke-dashoffset .9s var(--ease);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--hc) 70%,transparent))}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;align-content:center;font-family:var(--gf);font-weight:700;font-size:14px;line-height:1;text-align:center}
.ring .num small{display:block;font-size:9px;color:var(--muted);font-weight:500;margin-top:1px}

.path{display:flex;align-items:center;margin:18px 4px 26px}
.node{--sc:#555;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);flex-shrink:0;position:relative;transition:.3s}
.node small{position:absolute;top:37px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--dim);font-family:var(--gf);white-space:nowrap}
.node.done{background:color-mix(in srgb,var(--sc) 20%,transparent);border-color:color-mix(in srgb,var(--sc) 55%,transparent);box-shadow:0 0 14px -3px color-mix(in srgb,var(--sc) 70%,transparent)}
.node.cur{border:1.5px solid var(--sc);animation:pulse 2s infinite}
.node.cur small{color:var(--ink)}
.node.cur span{animation:bob 1.8s ease-in-out infinite;display:inline-block}
.node.lock{opacity:.45;font-size:11px;filter:grayscale(1)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sc) 45%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.seg{flex:1;height:3px;background:rgba(255,255,255,.07);margin:0 6px;border-radius:3px;overflow:hidden}
.seg i{display:block;height:100%;background:var(--hc);box-shadow:0 0 8px var(--hc);transition:width .9s var(--ease)}

.dots{display:flex;gap:3px;margin-bottom:14px}
.dot{flex:1 1 0;min-width:3px;height:6px;border-radius:3px;background:rgba(255,255,255,.07)}
.dot.on{background:var(--hc);box-shadow:0 0 6px color-mix(in srgb,var(--hc) 55%,transparent)}
.dot.new{animation:dotIn .6s var(--spring) both}
@keyframes dotIn{0%{transform:scaleY(0);opacity:0}100%{transform:none}}

.check{width:100%;font-family:var(--gf);font-weight:600;font-size:15px;padding:13px;border-radius:14px;background:var(--hc);color:#0a0c11;box-shadow:0 10px 24px -12px var(--hc),inset 0 1px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .2s}
.check span{background:rgba(10,12,17,.16);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
.check:active{transform:scale(.98)}
.check.ok{background:rgba(52,211,153,.1);color:#34d399;border:1px solid rgba(52,211,153,.25);box-shadow:none;cursor:default;animation:okIn .45s var(--spring)}
@keyframes okIn{0%{transform:scale(.96)}100%{transform:scale(1)}}
.undo{display:block;margin:8px auto 0;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.mbadge{text-align:center;font-weight:600;padding:12px;border-radius:14px;background:linear-gradient(135deg,rgba(245,176,65,.18),rgba(255,107,74,.12));color:#f5c46b;border:1px solid rgba(245,176,65,.35)}
.mbadge b{display:inline-block;animation:bob 1.6s ease-in-out infinite}

/* boş durum */
.empty{text-align:center;padding:48px 20px}
.empty .big{font-size:40px;width:84px;height:84px;border-radius:24px;display:inline-grid;place-items:center;background:linear-gradient(135deg,rgba(124,108,255,.2),rgba(34,211,238,.1));border:1px solid var(--line2);animation:bob 2.6s ease-in-out infinite}
.empty h2{font-family:var(--gf);font-weight:600;font-size:22px;margin:18px 0 8px;letter-spacing:-.01em}
.empty p{color:var(--muted);max-width:380px;margin:0 auto 22px;line-height:1.6;font-size:14px}

.btn{font-family:var(--gf);font-weight:600;padding:13px 20px;border-radius:14px;background:linear-gradient(135deg,#7c6cff,#5b8cff);color:#fff;box-shadow:0 10px 24px -12px rgba(124,108,255,.8),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s,filter .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--soft);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:rgba(244,63,94,.1);color:#fb7185;border:1px solid rgba(244,63,94,.25);box-shadow:none}
.btn.full{width:100%}

.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#7c6cff,#22d3ee);color:#fff;font-size:30px;font-weight:300;line-height:1;box-shadow:0 14px 30px -10px rgba(124,108,255,.85),inset 0 1px 0 rgba(255,255,255,.3);z-index:20;transition:transform .35s var(--spring)}
.fab:active{transform:scale(.9)}

@media (hover:hover){
  .iconbtn:hover{background:rgba(255,255,255,.1)}
  .card:hover{transform:translateY(-2px);border-color:var(--line2);box-shadow:0 22px 44px -26px color-mix(in srgb,var(--hc) 70%,transparent)}
  .top:hover .emoji{transform:rotate(-6deg) scale(1.06)}
  .check:not(.ok):hover,.btn:hover{filter:brightness(1.08)}
  .fab:hover{transform:rotate(90deg)}
}

/* pencereler */
.modal{position:fixed;inset:0;background:rgba(5,6,10,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:linear-gradient(180deg,#171a23,#111319);border:1px solid var(--line2);border-radius:24px;padding:22px;width:100%;max-width:460px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;animation:rise .4s var(--ease);position:relative;box-shadow:0 30px 80px -20px rgba(0,0,0,.75)}
@keyframes rise{from{transform:translateY(24px) scale(.98);opacity:0}}
.sheet h3{font-family:var(--gf);font-weight:600;font-size:20px;margin-bottom:16px;letter-spacing:-.01em}
.x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;background:var(--soft);border:1px solid var(--line);color:var(--muted);font-size:13px}
.lbl{font-size:11px;font-weight:600;color:var(--muted);margin:18px 0 8px;display:block;letter-spacing:.09em;text-transform:uppercase}
.inp{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.04);font-weight:500;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp::placeholder{color:var(--dim)}
.inp:focus{border-color:#7c6cff;box-shadow:0 0 0 3px rgba(124,108,255,.22)}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.egrid button{aspect-ratio:1;border-radius:10px;font-size:19px;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:transform .2s var(--spring),background .2s,border-color .2s}
.egrid button.sel{background:rgba(124,108,255,.2);border-color:#7c6cff;transform:scale(1.08)}
.cgrid{display:flex;gap:10px;flex-wrap:wrap}
.cgrid button{width:34px;height:34px;border-radius:50%;transition:transform .2s var(--spring)}
.cgrid button.sel{transform:scale(1.15);box-shadow:0 0 0 3px #13151c,0 0 0 5px #eef0f6}
.stagesinfo{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap;align-items:center}
.stagesinfo span{font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--soft);border:1px solid var(--line)}
.stagesinfo span[style]{border:none;color:var(--dim)}

/* kutlama */
.celebrate{text-align:center;padding-top:6px}
.celebrate .bigicon{font-size:52px;width:100px;height:100px;border-radius:30px;display:inline-grid;place-items:center;background:radial-gradient(circle,rgba(124,108,255,.35),rgba(124,108,255,.04) 70%);border:1px solid var(--line2);animation:boom .8s var(--spring)}
@keyframes boom{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1)}}
.celebrate h3{margin:16px 0 6px;font-size:22px}
.celebrate p{color:var(--muted);line-height:1.55;margin-bottom:8px;font-size:14px}
.celebrate .bonus{display:inline-block;margin:8px 0 16px;font-family:var(--gf);font-weight:700;background:rgba(245,176,65,.12);color:#f5c46b;border:1px solid rgba(245,176,65,.3);padding:6px 12px;border-radius:10px}
.unlock{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;margin:4px 0 16px;text-align:left;animation:rise .5s .3s var(--ease) both}
.unlock .ic{font-size:26px}
.unlock b{display:block;font-weight:600}
.unlock small{color:var(--muted)}

/* detay */
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-right:40px}
.dhead .emoji{width:56px;height:56px;font-size:28px;border-radius:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{font-family:var(--gf);font-size:17px;font-weight:700;display:block;white-space:nowrap}
.stat small{color:var(--muted);font-size:10.5px;line-height:1.3;display:block;margin-top:3px}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.srow .ic{font-size:18px;width:28px;text-align:center}
.srow .t{flex:1;font-weight:600;font-size:14px}
.srow .t small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.srow .st{font-family:var(--gf);font-size:12px;font-weight:600;padding:4px 9px;border-radius:8px;background:var(--soft)}
.srow.done .st{background:rgba(52,211,153,.12);color:#34d399}
.srow.cur{border-color:color-mix(in srgb,var(--hc) 50%,transparent);background:color-mix(in srgb,var(--hc) 7%,transparent)}
.srow.lock{opacity:.45}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;margin-bottom:20px}
.heat i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.05)}
.heat i.on{background:var(--hc);box-shadow:0 0 6px color-mix(in srgb,var(--hc) 45%,transparent)}
.heat i.fut{opacity:.25}
.heat i.now{outline:1.5px solid var(--ink);outline-offset:1px}
.drow{display:flex;gap:10px}
.drow .btn{flex:1}

/* gruplar */
.gtag{position:absolute;top:-9px;right:16px;background:#1b1f2b;border:1px solid var(--line2);color:var(--muted);font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.02em}
.mem{display:flex;align-items:center;margin:-2px 0 14px 6px;flex-wrap:wrap}
.av{--ac:#7c6cff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--gf);font-weight:700;font-size:11px;color:#0a0c11;position:relative;border:2px solid #14171f;margin-left:-6px;background:var(--ac);transition:transform .2s var(--spring)}
.av.ok::after{content:"✓";position:absolute;right:-5px;bottom:-5px;background:#34d399;color:#0a0c11;border-radius:50%;width:14px;height:14px;font-size:8px;font-weight:800;display:grid;place-items:center;border:2px solid #14171f}
.av.me{box-shadow:0 0 0 2px var(--ink)}
.memtxt{font-size:12px;color:var(--muted);margin-left:10px}
.wait{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}
.seg2{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg2 button{flex:1;padding:10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);transition:.2s}
.seg2 button.sel{background:rgba(255,255,255,.09);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.modes{display:flex;flex-direction:column;gap:8px}
.modes button{text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);transition:.2s}
.modes button b{display:block;font-weight:600}

/* bildirim + xp */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(28,31,42,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line2);color:var(--ink);padding:12px 16px;border-radius:14px;font-weight:500;font-size:14px;opacity:0;transition:.35s var(--ease);z-index:60;width:max-content;max-width:min(92vw,480px);text-align:center;pointer-events:none;box-shadow:0 20px 40px -16px rgba(0,0,0,.6)}

@keyframes xpup{0%{opacity:0;transform:translate(-50%,0) scale(.7)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

footer{margin-top:44px;text-align:center;color:var(--dim);font-size:12.5px;line-height:1.5}

  .sheet{max-width:none;border-radius:24px 24px 0 0;border-bottom:none;padding:28px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;max-height:92dvh;animation:sheetUp .38s var(--ease)}
  .sheet::before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
  .egrid{grid-template-columns:repeat(6,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .fab{right:16px;bottom:calc(16px + env(safe-area-inset-bottom))}

}
@keyframes sheetUp{from{transform:translateY(100%)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

        <button data-mode="shared"><b>🤝 Ortak seri</b><small>Gün ancak herkes yapınca sayılır. Biri kaçırırsa grup bölümü baştan başlar.</small></button>

<div class="toast" id="toast"></div>

<script>
const STAGES=[
  {days:7, name:'Kıvılcım',icon:'🔥',bonus:50, color:'#ff6b4a'},
  {days:14,name:'Alev',    icon:'⚡',bonus:100,color:'#f5b041'},
  {days:21,name:'Yıldız',  icon:'⭐',bonus:160,color:'#38bdf8'},
  {days:40,name:'Efsane',  icon:'👑',bonus:400,color:'#a78bfa'},
];
const EMOJIS=['🏃','💧','📚','🧘','🥗','💪','😴','✍️','🎸','🧹','🚭','📵','🙏','🌱','🧠','🦷','🚶','🍎','🎨','🗣️','💰','☀️','🧊','📝'];
const COLORS=['#ff6b4a','#f5b041','#34d399','#38bdf8','#a78bfa','#f472b6'];
const QUOTES=['Bugünün görevleri seni bekliyor','Seriyi koru','Tutarlılık > yoğunluk','Bir sonraki seviyeye az kaldı','Hedef: 40 gün'];
const KEY='seri-v1';
const FB_CFG={apiKey:"AIzaSyDcsLGXN8Jiesl43ZiZ0Pd9hFGSjVNfnCM",authDomain:"seri-79cae.firebaseapp.com",projectId:"seri-79cae",messagingSenderId:"262525359607",appId:"1:262525359607:web:96f38bf36ae74d6cf6caf2"};
const FBV='10.12.2';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const gidGen=()=>{const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(10));r.forEach(n=>s+=a[n%a.length]);return s};
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const[y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const need=l=>60+l*40;
const nickColor=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const initial=n=>(String(n).trim()[0]||'?').toLocaleUpperCase('tr');

let S=load();
S.groups=S.groups||[];S.gseen=S.gseen||{};
let fresh=null;
const seen=new Set();

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.habits))return d}catch(e){}
  return {habits:[],xp:0,level:1,sound:true,groups:[],gseen:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kaydedilemedi: tarayıcı depolaması kapalı olabilir')}}
const find=id=>S.habits.find(h=>h.id===id);

function addXP(n){
  S.xp+=n;let up=false;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;up=true}
  return up;
}

/* ---------- yerel: gün atlandıysa seriyi kır ---------- */
function audit(){
  const y=addDays(today(),-1);const broken=[];
  S.habits.forEach(h=>{
    if(h.mastered||!h.lastDate)return;
    if(h.lastDate<y){
      if(h.progress>0){h.progress=0;h.breaks=(h.breaks||0)+1;broken.push(h)}
      h.streak=0;
    }
    if(h.undo&&h.undo.date!==today())delete h.undo;
  });
  if(broken.length){
    save();
    const h=broken[0],st=STAGES[h.stageIdx];
    setTimeout(()=>toast(`😢 ${h.emoji} ${h.name}: seri bozuldu. ${st.icon} ${st.name} bölümü baştan başlıyor.`+(broken.length>1?` (+${broken.length-1} alışkanlık daha)`:'')),600);
  }
}

/* ================= BULUT (Firebase) ================= */
let fb=null,db=null,me=null,cloudState='loading';
const G={};

async function initCloud(){
  try{
    const [appM,authM,fsM]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)]);
    const app=appM.initializeApp(FB_CFG);
    const auth=authM.getAuth(app);
    fb=fsM;db=fsM.getFirestore(app);
    await new Promise((res,rej)=>{
      const off=authM.onAuthStateChanged(auth,u=>{
        if(u){me=u.uid;off();res()}
        else authM.signInAnonymously(auth).catch(rej);
      },rej);
    });
    cloudState='ok';
    S.groups.forEach(watch);
    handleHash();
    addEventListener('hashchange',handleHash);
    render();
  }catch(e){
    console.error(e);cloudState='err';render();
    if(/g=/.test(location.hash)||S.groups.length)toast('Bulut bağlantısı kurulamadı. Grup alışkanlıkları şu an görünmüyor.');
  }
}
const gRef=gid=>fb.doc(db,'groups',gid);
const mRef=(gid,u)=>fb.doc(db,'groups',gid,'members',u||me);

function watch(gid){
  if(G[gid]||!fb)return;
  const g=G[gid]={doc:null,members:{},loaded:false,unsub:[]};
  g.unsub.push(fb.onSnapshot(gRef(gid),s=>{
    if(!s.exists()){g.missing=true;render();return}
    g.doc=s.data();syncShared(gid);auditGroup(gid);render();
  },e=>{console.error(e);g.err=true;render()}));
  g.unsub.push(fb.onSnapshot(fb.collection(db,'groups',gid,'members'),qs=>{
    const m={};qs.forEach(d=>m[d.id]=d.data());
    g.members=m;
    g.loaded=true;auditGroup(gid);render();
  },e=>{console.error(e);g.err=true;render()}));
}
function unwatch(gid){const g=G[gid];if(!g)return;g.unsub.forEach(f=>f());delete G[gid]}

/* grup kartı için tek tip görünüm */
function groupView(gid){
  const g=G[gid];if(!g||!g.doc||!g.loaded)return null;
  const my=g.members[me]||{};
  const shared=g.doc.mode==='shared';
  const t=today(),y=addDays(t,-1);
  let streak;
  if(shared) streak=(g.doc.lastDate===t||g.doc.lastDate===y)?(g.doc.streak||0):0;
  else streak=(my.lastDate===t||my.lastDate===y)?(my.streak||0):0;
  const src=shared?g.doc:my;
  return {
    id:gid,group:true,shared,name:g.doc.name,emoji:g.doc.emoji,color:g.doc.color,created:g.doc.created,
    stageIdx:src.stageIdx||0,progress:src.progress||0,mastered:!!src.mastered,
    streak,best:shared?(g.doc.best||0):(my.best||0),breaks:src.breaks||0,
    total:my.total||0,history:my.history||[],lastDate:my.lastDate||null,
    members:g.members,joined:!!g.members[me]
  };
}

/* ortak seride bölüm atlama / kırılmayı herkese göster */
function syncShared(gid){
  const g=G[gid];if(!g.doc||g.doc.mode!=='shared')return;
  const lvl=(g.doc.stageIdx||0)+(g.doc.mastered?1:0),br=g.doc.breaks||0;
  const prev=S.gseen[gid];
  S.gseen[gid]={lvl,br};save();
  if(!prev)return;
  if(lvl>prev.lvl){
    const st=STAGES[Math.min(lvl-1,3)];const up=addXP(st.bonus);save();
    ding([523,659,784,1046]);
    setTimeout(()=>{const v=groupView(gid);if(v)celebrate(v,st,up)},500);
  }else if(br>prev.br){
    setTimeout(()=>toast(`💔 ${g.doc.emoji} ${g.doc.name}: biri bir günü kaçırdı, grup bölümü baştan başlıyor.`),500);
  }
}

/* günü kaçırınca kırma (günde bir kez) */
async function auditGroup(gid){
  const g=G[gid];if(!g||!g.doc||!g.loaded||g.audited===today())return;
  g.audited=today();
  const y=addDays(today(),-1),my=g.members[me];
  try{
    if(my&&my.lastDate&&my.lastDate<y){
      const up={};
      if(my.streak)up.streak=0;
      if(g.doc.mode==='solo'&&!my.mastered&&my.progress>0){
        up.progress=0;up.breaks=(my.breaks||0)+1;
        const st=STAGES[my.stageIdx||0];
        setTimeout(()=>toast(`😢 ${g.doc.emoji} ${g.doc.name}: seri bozuldu. ${st.icon} ${st.name} baştan.`),700);
      }
      if(Object.keys(up).length)await fb.updateDoc(mRef(gid),up);
    }
    if(g.doc.mode==='shared'&&my&&!g.doc.mastered&&g.doc.progress>0&&(!g.doc.lastDate||g.doc.lastDate<y)){
      await fb.runTransaction(db,async tx=>{
        const s=await tx.get(gRef(gid));const d=s.data();
        if(d.mastered||!(d.progress>0)||(d.lastDate&&d.lastDate>=y))return;
        tx.update(gRef(gid),{progress:0,streak:0,breaks:(d.breaks||0)+1});
      });
    }
  }catch(e){console.error(e)}
}

async function checkGroup(gid,el){
  const g=G[gid];const t=today();
  if(!g||!g.doc)return;
  const my=g.members[me];if(!my||my.lastDate===t)return;
  const solo=g.doc.mode==='solo';
  if(solo&&my.mastered)return;
  const streak=my.lastDate===addDays(t,-1)?(my.streak||0)+1:1;
  const upd={lastDate:t,streak,best:Math.max(my.best||0,streak),total:(my.total||0)+1,history:[...(my.history||[]),t].slice(-370)};
  let gain,stageDone=false,st;
  if(solo){
    let si=my.stageIdx||0,pr=(my.progress||0)+1;st=STAGES[si];gain=10+5*si;
    if(pr>=st.days){stageDone=true;gain+=st.bonus;if(si>=3){upd.mastered=true;pr=st.days}else{si++;pr=0}}
    upd.stageIdx=si;upd.progress=pr;
  }else gain=10+5*(g.doc.stageIdx||0);
  Object.assign(my,upd);
  const up=addXP(gain);fresh=gid;save();
  const r=el.getBoundingClientRect();
  render();
  floatXP(r.left+r.width/2,r.top,`+${gain} XP`);
  burst(r.left+r.width/2,r.top+r.height/2,36,[g.doc.color,...COLORS]);
  if(stageDone){ding([523,659,784,1046]);setTimeout(()=>{const v=groupView(gid);if(v)celebrate(v,st,up)},450)}
  else{ding([660,880]);if(up)setTimeout(levelUp,350)}
  try{
    await fb.updateDoc(mRef(gid),upd);
    if(!solo)await advanceShared(gid);
  }catch(e){console.error(e);toast('Buluta kaydedilemedi. Bağlantını kontrol edip sayfayı yenile.')}
}

async function advanceShared(gid){
  const t=today(),y=addDays(t,-1);
  const ms=await fb.getDocs(fb.collection(db,'groups',gid,'members'));
  let all=ms.size>0;ms.forEach(d=>{if(d.data().lastDate!==t)all=false});
  if(!all)return;
  const did=await fb.runTransaction(db,async tx=>{
    const s=await tx.get(gRef(gid));const d=s.data();
    if(d.mastered||d.lastDate===t)return false;
    const cont=d.lastDate===y;
    let si=d.stageIdx||0,pr=(cont?(d.progress||0):0)+1;
    const streak=cont?(d.streak||0)+1:1;
    const st=STAGES[si];const upd={lastDate:t,streak,best:Math.max(d.best||0,streak)};
    if(pr>=st.days){if(si>=3){upd.mastered=true;pr=st.days}else{si++;pr=0}}
    upd.stageIdx=si;upd.progress=pr;
    tx.update(gRef(gid),upd);return true;
  });
  if(did)setTimeout(()=>toast('🤝 Herkes bugün tamamladı! Grup serisi +1'),900);
}

async function createGroup(){
  const name=$('#hName').value.trim(),nick=$('#gNick').value.trim();
  if(!name){shake('#hName');return}
  if(!nick){shake('#gNick');return}
  if(cloudState!=='ok'){toast(cloudState==='loading'?'Buluta bağlanıyor, birkaç saniye sonra tekrar dene':'Bulut bağlantısı yok, grup kurulamadı');return}
  const btn=$('#addBtn');btn.disabled=true;btn.textContent='Kuruluyor…';
  const gid=gidGen(),t=today();
  try{
    await fb.setDoc(gRef(gid),{name,emoji:addSel.emoji,color:addSel.color,mode:addSel.mode,createdBy:me,created:t,stageIdx:0,progress:0,lastDate:null,streak:0,best:0,breaks:0,mastered:false});
    await fb.setDoc(mRef(gid),newMember(nick,t));
    S.nick=nick;S.groups.push(gid);save();watch(gid);
    closeModal('addModal');ding([523,784]);
    showShare(gid,name,addSel.emoji);
  }catch(e){console.error(e);toast('Grup kurulamadı: '+(e.code||'bağlantı hatası'))}
  finally{btn.disabled=false;setAddBtn()}
}
const newMember=(nick,t)=>({nick,joined:t,stageIdx:0,progress:0,streak:0,best:0,total:0,breaks:0,history:[],lastDate:null,mastered:false});

const shareLink=gid=>location.origin+location.pathname+'#g='+gid;
function showShare(gid,name,emoji){
  const link=shareLink(gid);
  const msg=`${emoji} "${name}" alışkanlığına benimle başla! Seri'de birlikte takip edelim: ${link}`;
  $('#shareSheet').innerHTML=`
    <button class="x" data-close>✕</button>
    <div class="celebrate"><div class="bigicon">👥</div><h3>Davet linki hazır</h3>
    <p>Bu linki açan herkes, üye olmadan takma adıyla gruba katılabilir.</p></div>
    <div class="linkbox"><input class="inp" id="shareInp" readonly value="${esc(link)}"><button class="btn" id="copyBtn">Kopyala</button></div>
    <a class="btn full" style="display:block;text-align:center;text-decoration:none;background:#25d366;box-shadow:0 5px 0 #179a48" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp'ta paylaş</a>

function allViews(){
  const v=[...S.habits];
  S.groups.forEach(gid=>{
    const gv=groupView(gid);
    if(gv&&gv.joined)v.push(gv);
    else if(cloudState!=='err')v.push({id:gid,group:true,loading:true,missing:G[gid]&&G[gid].missing});
  });
  return v;
}

function render(){
  const t=today();
  $('#lvl').textContent=S.level;
  $('#xpbar').style.width=Math.min(100,S.xp/need(S.level)*100)+'%';
  $('#xpring').style.strokeDashoffset=213.6*(1-Math.min(1,S.xp/need(S.level)));
  $('#xptext').textContent=`${S.xp} / ${need(S.level)} XP · sonraki seviyeye ${need(S.level)-S.xp}`;
  $('#soundBtn').textContent=S.sound===false?'🔇':'🔊';
  const views=allViews();
  const active=views.filter(h=>!h.loading&&!h.mastered);
  const doneN=active.filter(h=>h.lastDate===t).length;
  $('#today').textContent=active.length?`Bugün ${doneN}/${active.length} ✓`:'';
  const m=$('#mascot');
  m.classList.toggle('happy',active.length>0&&doneN===active.length);
  m.classList.toggle('sleepy',active.length>0&&doneN===0);

  const g=$('#grid');
  $('#secHead').hidden=!views.length;
  if(!views.length){g.innerHTML='';$('#empty').hidden=false;return}
  $('#empty').hidden=true;
  g.innerHTML=views.map(h=>h.loading?loadingCard(h):cardHTML(h,t)).join('');
  views.forEach(h=>{if(!h.loading)seen.add(h.id)});
  fresh=null;
}

function loadingCard(h){
  return `<div class="card" style="--hc:#5c6274;opacity:.75"><span class="gtag">👥 Grup</span>
    <div class="top"><div class="emoji">${h.missing?'❓':'⏳'}</div><div class="info"><div class="name">${h.missing?'Grup bulunamadı':'Yükleniyor…'}</div><div class="sub">${h.missing?'Bu grup silinmiş olabilir':'Buluttan getiriliyor'}</div></div></div>
    ${h.missing?`<button class="undo" data-forget="${h.id}">listeden kaldır</button>`:''}</div>`;
}

function memberChips(h,t){
  const list=Object.entries(h.members).sort((a,b)=>(a[0]===me?-1:b[0]===me?1:0));
  const shown=list.slice(0,7);
  const chips=shown.map(([u,m])=>`<div class="av ${m.lastDate===t?'ok':''} ${u===me?'me':''}" style="--ac:${nickColor(m.nick)}" title="${esc(m.nick)}${m.lastDate===t?' · bugün tamam':''}">${esc(initial(m.nick))}</div>`).join('');
  const extra=list.length>7?`<div class="av" style="--ac:#b9afc8">+${list.length-7}</div>`:'';
  const doneN=list.filter(([,m])=>m.lastDate===t).length;
  return `<div class="mem">${chips}${extra}<span class="memtxt">${doneN}/${list.length} bugün</span></div>`;
}

function cardHTML(h,t){
  const idx=Math.min(h.stageIdx,3),st=STAGES[idx];
  const doneToday=h.lastDate===t;
  const prog=h.mastered?st.days:h.progress;
  const r=24,C=2*Math.PI*r,off=C*(1-prog/st.days);
  const enter=seen.has(h.id)?'':'enter';
  const chk=h.group?'data-gcheck':'data-check',det=h.group?'data-gdetail':'data-detail';

  const path=STAGES.map((s,i)=>{
    const reached=h.mastered||i<h.stageIdx;
    const cls=reached?'done':(i===h.stageIdx?'cur':'lock');
    const node=`<div class="node ${cls}" style="--sc:${s.color}" title="${s.name} · ${s.days} gün"><span>${cls==='lock'?'🔒':s.icon}</span><small>${s.days}g</small></div>`;
    if(i===0)return node;
    const p=i-1;
    const fill=(h.mastered||p<h.stageIdx)?100:(p===h.stageIdx?prog/STAGES[p].days*100:0);
    return `<div class="seg"><i style="width:${fill}%"></i></div>`+node;
  }).join('');

  let dots='';
  for(let d=0;d<st.days;d++){
    const on=d<prog;
    const nw=on&&fresh===h.id&&d===prog-1;
    dots+=`<i class="dot ${on?'on':''} ${nw?'new':''}"></i>`;
  }

  let action;
  if(h.mastered) action=`<div class="mbadge"><b>👑</b> Efsane! 40 günlük seriyi ${h.shared?'birlikte ':''}bitirdiniz</div>`;
  else if(doneToday){
    action=`<button class="check ok" disabled>✓ ${h.group?'Sen tamam!':'Bugün tamam!'}</button>`;
    if(!h.group&&h.undo)action+=`<button class="undo" data-undo="${h.id}">geri al</button>`;
    if(h.shared){
      const waiting=Object.values(h.members).filter(m=>m.lastDate!==t).map(m=>m.nick);
      action+=`<div class="wait">${waiting.length?`⏳ Bekleniyor: ${waiting.slice(0,3).map(esc).join(', ')}${waiting.length>3?` +${waiting.length-3}`:''}`:'🤝 Herkes tamam! Gün sayıldı'}</div>`;
    }
  }
  else action=`<button class="check" ${chk}="${h.id}">Bugünü tamamla <span>+${10+5*idx} XP</span></button>`;

  const sub=h.mastered?`👑 Ustalaştın${h.rounds?` · ${h.rounds+1}. tur`:''}`:`${st.icon} ${st.name} · <span class="fl">🔥 ${h.streak||0} gün</span>`;
  const tag=h.group?`<span class="gtag">${h.shared?'🤝 Ortak seri':'👥 Grup'}</span>`:'';

  return `<div class="card ${enter} ${doneToday?'done':''} ${h.mastered?'master':''}" style="--hc:${esc(h.color)}">${tag}
    <div class="top" ${det}="${h.id}">
      <div class="emoji">${esc(h.emoji)}</div>
      <div class="info"><div class="name">${esc(h.name)}</div><div class="sub">${sub}</div></div>
      <div class="ring">
        <svg width="58" height="58"><circle class="tr" cx="29" cy="29" r="${r}"/><circle class="pr" cx="29" cy="29" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <div class="num">${prog}<small>/${st.days}</small></div>
      </div>
    </div>
    <div class="path">${path}</div>
    <div class="dots">${dots}</div>
    ${h.group?memberChips(h,t):''}
    ${action}
  </div>`;
}

function check(id,el){
  const h=find(id),t=today();
  if(!h||h.mastered||h.lastDate===t)return;
  const {undo,...snap}=h;
  h.undo={snap:JSON.stringify(snap),xp:S.xp,level:S.level,date:t};
  h.streak=h.lastDate===addDays(t,-1)?(h.streak||0)+1:1;
  h.best=Math.max(h.best||0,h.streak);
  h.total=(h.total||0)+1;
  h.history.push(t);h.lastDate=t;h.progress++;
  const st=STAGES[h.stageIdx];
  let gain=10+5*h.stageIdx,stageDone=false;
  if(h.progress>=st.days){
    stageDone=true;gain+=st.bonus;
    if(h.stageIdx>=STAGES.length-1){h.mastered=true;h.progress=st.days}
    else{h.stageIdx++;h.progress=0}
  }
  const up=addXP(gain);
  fresh=id;save();
  const r=el.getBoundingClientRect();
  render();
  floatXP(r.left+r.width/2,r.top,`+${gain} XP`);
  burst(r.left+r.width/2,r.top+r.height/2,36,[h.color,...COLORS]);
  if(stageDone){ding([523,659,784,1046]);setTimeout(()=>celebrate(h,st,up),450)}
  else{ding([660,880]);if(up)setTimeout(levelUp,350)}
}

function undoCheck(id){

let tt;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3400)}
function floatXP(x,y,txt){const e=document.createElement('div');e.className='xpfloat';e.textContent=txt;e.style.left=x+'px';e.style.top=(y-10)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function resize(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
function burst(x,y,n=40,colors=COLORS){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,life:60+Math.random()*40,r:5+Math.random()*5,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.35,sq:Math.random()<.55});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy+=.25;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
    cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.sq)cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{cx.beginPath();cx.arc(0,0,p.r/2,0,7);cx.fill()}
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
}
function rain(k=5){for(let i=0;i<k;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.2+Math.random()*.2),60),i*170)}

let AC;
function ding(notes){
  if(S.sound===false)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime;
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),s=t0+i*.09;
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.16,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+.35);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.4);
    });
  }catch(e){}
}

document.addEventListener('click',e=>{
  const t=e.target;
  let b;
  if(b=t.closest('[data-check]'))return check(b.dataset.check,b);
  if(b=t.closest('[data-gcheck]'))return checkGroup(b.dataset.gcheck,b);
  if(b=t.closest('[data-undo]'))return undoCheck(b.dataset.undo);
  if(b=t.closest('[data-detail]'))return openDetail(b.dataset.detail);
  if(b=t.closest('[data-gdetail]'))return openGroupDetail(b.dataset.gdetail);
  if(t.closest('[data-open-add]'))return openAdd();
  if(t.closest('[data-close]'))return t.closest('.modal').classList.remove('open');
  if(t.classList.contains('modal'))return t.classList.remove('open');
  if(b=t.closest('[data-e]')){addSel.emoji=b.dataset.e;return drawPickers()}
  if(b=t.closest('[data-c]')){addSel.color=b.dataset.c;return drawPickers()}
  if(b=t.closest('[data-kind]')){addSel.kind=b.dataset.kind;drawKind();if(addSel.kind==='group'&&!$('#gNick').value)$('#gNick').focus();return}
  if(b=t.closest('[data-mode]')){addSel.mode=b.dataset.mode;return drawKind()}
  if(b=t.closest('[data-share]')){const v=groupView(b.dataset.share);closeModal('detailModal');if(v)showShare(v.id,v.name,v.emoji);return}
  if(b=t.closest('[data-forget]')){const id=b.dataset.forget;unwatch(id);S.groups=S.groups.filter(x=>x!==id);save();render();return}
  if(b=t.closest('[data-leave]')){
    if(b.dataset.armed)leaveGroup(b.dataset.leave);
    else{b.dataset.armed=1;b.textContent='Emin misin? Tekrar bas'}
    return;
  }
  if(b=t.closest('[data-del]')){
    if(b.dataset.armed){S.habits=S.habits.filter(h=>h.id!==b.dataset.del);save();closeModal('detailModal');render();toast('Silindi')}
    else{b.dataset.armed=1;b.textContent='Emin misin? Tekrar bas';}
    return;
  }
  if(b=t.closest('[data-again]')){
    const h=find(b.dataset.again);
    Object.assign(h,{stageIdx:0,progress:0,mastered:false,rounds:(h.rounds||0)+1,streak:h.lastDate===today()?h.streak:0});
    delete h.undo;save();closeModal('detailModal');render();toast('🔁 Yeni tur başladı: 7 gün');
  }
});
$('#addBtn').onclick=addHabit;
$('#hName').addEventListener('keydown',e=>{if(e.key==='Enter')addHabit()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'))});

$('#soundBtn').onclick=()=>{S.sound=S.sound===false;save();render();if(S.sound)ding([660])};

let bt;
$('#mascot').onclick=()=>{
  const m=$('#mascot'),b=$('#bubble');
  m.classList.remove('wiggle');void m.offsetWidth;m.classList.add('wiggle');
  setTimeout(()=>m.classList.remove('wiggle'),500);
  b.textContent=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  b.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('show'),1800);
  ding([880]);
};

$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`seri-yedek-${today()}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!Array.isArray(d.habits))throw 0;
      Object.keys(G).forEach(unwatch);
      S=d;S.groups=S.groups||[];S.gseen=S.gseen||{};save();seen.clear();audit();
      if(fb)S.groups.forEach(watch);
      render();toast('Yedek yüklendi ✅');
    }catch(err){toast('Bu dosya geçerli bir yedek değil')}
  };
  r.readAsText(f);e.target.value='';
};

/* gün değişince kontrol */
let lastDay=today();
function dayTick(){if(today()!==lastDay){lastDay=today();audit();Object.keys(G).forEach(auditGroup);render()}}
setInterval(dayTick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayTick()});

audit();render();initCloud();
</script>
