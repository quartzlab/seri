<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<title>Seri · Alışkanlık Macerası</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ef; --ink:#2b2340; --muted:#8a819e; --card:#fff; --line:#f1e8de; --soft:#f5efe8;
  --shadow:0 6px 0 rgba(43,35,64,.06), 0 18px 40px -20px rgba(43,35,64,.28);
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit;color:inherit}

/* arka plan */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg span{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:float 20s ease-in-out infinite}
.bg span:nth-child(1){width:420px;height:420px;background:#ffd3b6;top:-120px;left:-120px}
.bg span:nth-child(2){width:360px;height:360px;background:#dccfff;bottom:-90px;right:-90px;animation-delay:-7s}
.bg span:nth-child(3){width:280px;height:280px;background:#c6f2d8;top:42%;left:58%;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-40px) scale(1.1)}66%{transform:translate(-40px,30px) scale(.93)}}

.wrap{max-width:1000px;margin:0 auto;padding:22px 18px 130px}

/* üst bar */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font-weight:900;font-size:26px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.brand b{display:inline-block;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.12)}}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:18px;display:grid;place-items:center;transition:transform .15s}
.iconbtn:active{transform:scale(.9)}

/* oyuncu kartı */
.player{display:flex;align-items:center;gap:18px;background:#fff;border-radius:28px;padding:18px 20px;box-shadow:var(--shadow);border:2px solid var(--line);margin-bottom:24px;position:relative}
.pinfo{flex:1;min-width:0}
.prow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lvl{font-weight:900;font-size:20px}
.lvl span{display:inline-block;background:linear-gradient(135deg,#8f6bff,#ff5d8f);color:#fff;border-radius:12px;padding:2px 10px;margin-left:6px;font-size:16px}
.todaytxt{font-weight:800;color:var(--muted);font-size:14px}
.xpwrap{height:14px;background:var(--soft);border-radius:10px;overflow:hidden;margin:10px 0 6px;position:relative}
.xpbar{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#ffb347,#ff7a59,#ff5d8f);transition:width .8s var(--spring);position:relative}
.xpbar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 2.4s infinite;transform:translateX(-100%)}
@keyframes shine{to{transform:translateX(100%)}}
.xptext{font-size:12px;font-weight:800;color:var(--muted)}

/* maskot */
.mascot{width:78px;height:72px;position:relative;flex-shrink:0;cursor:pointer;animation:breathe 3s ease-in-out infinite;transform-origin:50% 100%}
.mascot .blob{position:absolute;inset:0;background:linear-gradient(160deg,#ffb38a,#ff7a59);border-radius:50% 50% 44% 44%/62% 62% 38% 38%;box-shadow:inset -7px -9px 0 rgba(0,0,0,.08)}
.mascot .eye{position:absolute;top:28px;width:9px;height:12px;background:var(--ink);border-radius:50%;animation:blink 4.5s infinite}
.mascot .eye.l{left:24px}.mascot .eye.r{right:24px}
.mascot .eye::after{content:"";position:absolute;top:2px;left:2px;width:3px;height:3px;background:#fff;border-radius:50%}
.mascot .cheek{position:absolute;top:42px;width:11px;height:6px;background:#ff4d7e;opacity:.45;border-radius:50%}
.mascot .cheek.l{left:13px}.mascot .cheek.r{right:13px}
.mascot .mouth{position:absolute;top:42px;left:50%;width:14px;height:7px;border:3px solid var(--ink);border-top:none;border-radius:0 0 14px 14px;transform:translateX(-50%);transition:.3s}
.mascot.happy{animation:hop .9s ease-in-out infinite}
.mascot.happy .mouth{width:18px;height:10px;background:#c2304f;border-color:var(--ink)}
.mascot.sleepy .eye{height:3px;top:33px;animation:none}
.mascot.sleepy .eye::after{display:none}
.mascot.sleepy .mouth{width:7px;height:7px;border:3px solid var(--ink);border-radius:50%}
.mascot.wiggle{animation:wiggle .5s ease}
.mascot .zzz{position:absolute;right:-8px;top:-10px;font-weight:900;color:var(--muted);font-size:14px;opacity:0}
.mascot.sleepy .zzz{animation:zzz 2.4s infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,.96)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-12px) scale(.95,1.06)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
@keyframes zzz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-14px)}}
.bubble{position:absolute;left:96px;top:-14px;background:var(--ink);color:#fff;font-weight:800;font-size:13px;padding:8px 12px;border-radius:14px 14px 14px 4px;opacity:0;transform:scale(.6) translateY(8px);transform-origin:0 100%;transition:.3s var(--spring);pointer-events:none;white-space:nowrap;z-index:3}
.bubble.show{opacity:1;transform:scale(1) translateY(0)}

/* kartlar */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:18px}
.card{--hc:#ff7a59;background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--shadow);border:2px solid var(--line);position:relative;transition:transform .25s var(--spring),border-color .3s}
.card:hover{transform:translateY(-3px)}
.card.enter{animation:pop .55s var(--spring) both}
.card.done{border-color:color-mix(in srgb,var(--hc) 40%,white)}
.card.master{background:linear-gradient(160deg,#fffaf0,#fff3d6);border-color:#f5c451}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(24px)}}
.top{display:flex;align-items:center;gap:12px;cursor:pointer}
.emoji{width:56px;height:56px;border-radius:19px;display:grid;place-items:center;font-size:29px;background:color-mix(in srgb,var(--hc) 16%,white);flex-shrink:0;transition:transform .3s var(--spring)}
.top:hover .emoji{transform:rotate(-8deg) scale(1.08)}
.info{flex:1;min-width:0}
.name{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);font-weight:800;margin-top:2px}
.sub .fl{color:#ff7a59}
.ring{width:58px;height:58px;position:relative;flex-shrink:0}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .tr{stroke:var(--soft)}
.ring .pr{stroke:var(--hc);transition:stroke-dashoffset .8s var(--spring)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:13px;line-height:1;text-align:center}
.ring .num small{display:block;font-size:9px;color:var(--muted)}

.path{display:flex;align-items:center;margin:18px 6px 22px}
.node{--sc:#ccc;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--soft);flex-shrink:0;position:relative;transition:.3s}
.node small{position:absolute;top:39px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:900;color:var(--muted);white-space:nowrap}
.node.done{background:var(--sc);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.node.cur{background:#fff;border:3px solid var(--sc);animation:pulse 1.8s infinite}
.node.cur span{animation:bob 1.6s ease-in-out infinite;display:inline-block}
.node.lock{opacity:.55;font-size:13px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--sc) 55%,transparent)}70%{box-shadow:0 0 0 11px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.seg{flex:1;height:7px;background:var(--soft);margin:0 4px;border-radius:7px;overflow:hidden}
.seg i{display:block;height:100%;border-radius:7px;background:var(--hc);transition:width .8s var(--spring)}

.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.dot{width:13px;height:13px;border-radius:4px;background:var(--soft)}
.dot.on{background:var(--hc)}
.dot.new{animation:dotIn .6s var(--spring) both}
@keyframes dotIn{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1)}}

.check{width:100%;font-weight:900;font-size:16px;padding:14px;border-radius:18px;background:var(--hc);color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--hc) 65%,black);transition:transform .1s,box-shadow .1s;display:flex;align-items:center;justify-content:center;gap:8px}
.check span{background:rgba(255,255,255,.25);border-radius:10px;padding:2px 8px;font-size:12px}
.check:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--hc) 65%,black)}
.check.ok{background:#eafaf0;color:#2e9d5b;box-shadow:none;cursor:default;animation:okIn .5s var(--spring)}
@keyframes okIn{0%{transform:scale(.9)}100%{transform:scale(1)}}
.undo{display:block;margin:8px auto 0;font-size:12px;font-weight:800;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.mbadge{text-align:center;font-weight:900;padding:13px;border-radius:18px;background:linear-gradient(135deg,#ffd76a,#f5a623);color:#6b4300;box-shadow:0 5px 0 #c98612}
.mbadge b{display:inline-block;animation:bob 1.4s ease-in-out infinite}

/* boş durum */
.empty{text-align:center;padding:50px 20px}
.empty .big{font-size:70px;display:inline-block;animation:hop 1.4s ease-in-out infinite}
.empty h2{font-weight:900;margin:14px 0 6px}
.empty p{color:var(--muted);font-weight:700;max-width:380px;margin:0 auto 20px;line-height:1.5}

.btn{font-weight:900;padding:13px 22px;border-radius:16px;background:var(--ink);color:#fff;box-shadow:0 5px 0 #000;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 #e2d8cc}
.btn.danger{background:#ffe9ec;color:#d6334f;box-shadow:0 4px 0 #f6c3cc}
.btn.full{width:100%}

/* FAB */
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:22px;background:linear-gradient(135deg,#ff7a59,#ff5d8f);color:#fff;font-size:34px;font-weight:900;box-shadow:0 6px 0 #c8385f,0 20px 30px -10px rgba(255,93,143,.6);z-index:20;transition:transform .3s var(--spring)}
.fab:hover{transform:rotate(90deg) scale(1.05)}
.fab:active{transform:scale(.9)}

/* modallar */
.modal{position:fixed;inset:0;background:rgba(43,35,64,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;border-radius:30px;padding:24px;width:100%;max-width:450px;max-height:90vh;overflow:auto;animation:rise .4s var(--spring);position:relative}
@keyframes rise{from{transform:translateY(40px) scale(.95);opacity:0}}
.sheet h3{font-weight:900;font-size:22px;margin-bottom:16px}
.x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:12px;background:var(--soft);font-weight:900}
.lbl{font-size:13px;font-weight:900;color:var(--muted);margin:14px 0 8px;display:block}
.inp{width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--soft);font-weight:800;font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:#ff7a59;background:#fff}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.egrid button{aspect-ratio:1;border-radius:12px;font-size:21px;background:var(--soft);transition:transform .2s var(--spring)}
.egrid button.sel{background:#ffe3d6;transform:scale(1.12);box-shadow:0 0 0 2px #ff7a59}
.cgrid{display:flex;gap:10px}
.cgrid button{width:38px;height:38px;border-radius:50%;transition:transform .2s var(--spring)}
.cgrid button.sel{transform:scale(1.18);box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.stagesinfo{display:flex;gap:6px;margin:16px 0 18px;flex-wrap:wrap}
.stagesinfo span{font-size:12px;font-weight:900;padding:6px 10px;border-radius:10px;background:var(--soft)}

/* kutlama */
.celebrate{text-align:center;padding-top:10px}
.celebrate .bigicon{font-size:84px;display:inline-block;animation:boom .9s var(--spring)}
@keyframes boom{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1)}}
.celebrate h3{margin:10px 0 8px}
.celebrate p{color:var(--muted);font-weight:700;line-height:1.5;margin-bottom:8px}
.celebrate .bonus{display:inline-block;margin:8px 0 18px;font-weight:900;background:#fff1c9;color:#a86b00;padding:6px 14px;border-radius:12px}
.unlock{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:18px;padding:12px 14px;margin:6px 0 16px;text-align:left;animation:rise .5s .3s var(--spring) both}
.unlock .ic{font-size:30px}
.unlock b{display:block}
.unlock small{color:var(--muted);font-weight:800}

/* detay */
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.dhead .emoji{width:64px;height:64px;font-size:34px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--soft);border-radius:18px;padding:12px 14px}
.stat b{font-size:22px;font-weight:900;display:block}
.stat small{font-weight:800;color:var(--muted);font-size:12px}
.slist{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:2px solid var(--line)}
.srow .ic{font-size:22px;width:32px;text-align:center}
.srow .t{flex:1;font-weight:900}
.srow .t small{display:block;color:var(--muted);font-weight:800;font-size:12px}
.srow .st{font-size:12px;font-weight:900;padding:4px 9px;border-radius:9px;background:var(--soft)}
.srow.done .st{background:#eafaf0;color:#2e9d5b}
.srow.cur{border-color:var(--hc)}
.srow.lock{opacity:.5}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-bottom:18px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--soft)}
.heat i.on{background:var(--hc)}
.heat i.fut{opacity:.3}
.heat i.now{box-shadow:0 0 0 2px var(--ink)}
.drow{display:flex;gap:10px}
.drow .btn{flex:1}

/* gruplar */
.gtag{position:absolute;top:-11px;right:18px;background:var(--ink);color:#fff;font-size:11px;font-weight:900;padding:4px 10px;border-radius:10px;letter-spacing:.2px}
.mem{display:flex;align-items:center;margin:-2px 0 14px 6px;flex-wrap:wrap;gap:0}
.av{--ac:#ff7a59;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff;position:relative;border:2px solid #fff;margin-left:-6px;background:var(--ac);transition:transform .2s var(--spring)}
.av:hover{transform:translateY(-3px) scale(1.1);z-index:2}
.av.ok::after{content:"✓";position:absolute;right:-5px;bottom:-5px;background:#3bb273;color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;display:grid;place-items:center;border:2px solid #fff}
.av.me{box-shadow:0 0 0 2px var(--ink)}
.memtxt{font-size:12px;font-weight:800;color:var(--muted);margin-left:10px}
.wait{text-align:center;font-size:12px;font-weight:800;color:var(--muted);margin-top:8px}
.seg2{display:flex;background:var(--soft);border-radius:16px;padding:4px;gap:4px;margin-bottom:4px}
.seg2 button{flex:1;padding:10px;border-radius:12px;font-weight:900;font-size:14px;color:var(--muted);transition:.2s}
.seg2 button.sel{background:#fff;color:var(--ink);box-shadow:0 2px 0 #e2d8cc}
.modes{display:flex;flex-direction:column;gap:8px}
.modes button{text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--line);transition:.2s}
.modes button b{display:block;font-weight:900}
.modes button small{color:var(--muted);font-weight:700;font-size:12px}
.modes button.sel{border-color:#ff7a59;background:#fff6f1}
.mlist{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--soft)}
.mrow .av{margin:0;border:none}
.mrow .nm{flex:1;font-weight:900;font-size:14px}
.mrow .nm small{display:block;font-weight:800;color:var(--muted);font-size:11px}
.mrow .rk{font-size:18px;width:24px;text-align:center}
.linkbox{display:flex;gap:8px;margin:6px 0 12px}
.linkbox input{flex:1;min-width:0;font-size:13px}
.joinhead{text-align:center;margin-bottom:8px}
.joinhead .emoji{margin:0 auto 10px;width:72px;height:72px;font-size:38px;border-radius:24px}
.note{font-size:12px;color:var(--muted);font-weight:700;line-height:1.5;margin-top:10px}

/* toast + xp */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:13px 18px;border-radius:18px;font-weight:800;font-size:14px;opacity:0;transition:.4s var(--spring);z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.xpfloat{position:fixed;font-weight:900;font-size:20px;color:#ff7a59;pointer-events:none;z-index:70;animation:xpup 1.1s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 8px #fff;transform:translateX(-50%)}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

footer{margin-top:40px;text-align:center;color:var(--muted);font-weight:700;font-size:13px}
footer .fbtns{display:flex;gap:10px;justify-content:center;margin-top:10px}
footer button{font-weight:900;font-size:13px;padding:8px 14px;border-radius:12px;background:#fff;box-shadow:var(--shadow)}

@media (max-width:520px){
  .player{padding:16px}
  .bubble{left:auto;right:0;top:-40px;border-radius:14px 14px 4px 14px;transform-origin:100% 100%}
  .egrid{grid-template-columns:repeat(6,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="bg"><span></span><span></span><span></span></div>
<canvas id="fx"></canvas>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><b>🔥</b> Seri</div>
    <button class="iconbtn" id="soundBtn" title="Ses">🔊</button>
  </div>

  <div class="player">
    <div class="mascot" id="mascot">
      <div class="blob"></div>
      <div class="eye l"></div><div class="eye r"></div>
      <div class="cheek l"></div><div class="cheek r"></div>
      <div class="mouth"></div>
      <div class="zzz">z</div>
    </div>
    <div class="bubble" id="bubble"></div>
    <div class="pinfo">
      <div class="prow">
        <div class="lvl">Seviye<span id="lvl">1</span></div>
        <div class="todaytxt" id="today"></div>
      </div>
      <div class="xpwrap"><div class="xpbar" id="xpbar"></div></div>
      <div class="xptext" id="xptext"></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="empty" id="empty" hidden>
    <div class="big">🌱</div>
    <h2>Macera seni bekliyor</h2>
    <p>Bir alışkanlık ekle. Önce 7 gün, sonra 14, 21 ve en sonunda 40 günlük Efsane bölümü açılır.</p>
    <button class="btn" data-open-add>İlk alışkanlığı ekle</button>

<div class="toast" id="toast"></div>

<script>
const STAGES=[
  {days:7, name:'Kıvılcım',icon:'🔥',bonus:50, color:'#ff7a59'},
  {days:14,name:'Alev',    icon:'⚡',bonus:100,color:'#f5a623'},
  {days:21,name:'Yıldız',  icon:'⭐',bonus:160,color:'#3a9bdc'},
  {days:40,name:'Efsane',  icon:'👑',bonus:400,color:'#8f6bff'},
];
const EMOJIS=['🏃','💧','📚','🧘','🥗','💪','😴','✍️','🎸','🧹','🚭','📵','🙏','🌱','🧠','🦷','🚶','🍎','🎨','🗣️','💰','☀️','🧊','📝'];
const COLORS=['#ff7a59','#f5a623','#3bb273','#3a9bdc','#8f6bff','#ff5d8f'];
const QUOTES=['Selam! 👋','Bugün hangisi? 👀','Seri bozulmasın! 🔥','Bir tık uzaktasın ✨','Hop hop! 🐣','Efsane yolunda 👑'];
const KEY='seri-v1';
const FB_CFG={apiKey:"AIzaSyDcsLGXN8Jiesl43ZiZ0Pd9hFGSjVNfnCM",authDomain:"seri-79cae.firebaseapp.com",projectId:"seri-79cae",messagingSenderId:"262525359607",appId:"1:262525359607:web:96f38bf36ae74d6cf6caf2"};
const FBV='10.12.2';

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const gidGen=()=>{const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(10));r.forEach(n=>s+=a[n%a.length]);return s};
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const addDays=(k,n)=>{const[y,m,d]=k.split('-').map(Number);return dkey(new Date(y,m-1,d+n))};
const need=l=>60+l*40;
const nickColor=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const initial=n=>(String(n).trim()[0]||'?').toLocaleUpperCase('tr');

let S=load();
S.groups=S.groups||[];S.gseen=S.gseen||{};
let fresh=null;
const seen=new Set();

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.habits))return d}catch(e){}
  return {habits:[],xp:0,level:1,sound:true,groups:[],gseen:{}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kaydedilemedi: tarayıcı depolaması kapalı olabilir')}}
const find=id=>S.habits.find(h=>h.id===id);

function addXP(n){
  S.xp+=n;let up=false;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;up=true}
  return up;
}

/* ---------- yerel: gün atlandıysa seriyi kır ---------- */
function audit(){
  const y=addDays(today(),-1);const broken=[];
  S.habits.forEach(h=>{
    if(h.mastered||!h.lastDate)return;
    if(h.lastDate<y){
      if(h.progress>0){h.progress=0;h.breaks=(h.breaks||0)+1;broken.push(h)}
      h.streak=0;
    }
    if(h.undo&&h.undo.date!==today())delete h.undo;
  });
  if(broken.length){
    save();
    const h=broken[0],st=STAGES[h.stageIdx];
    setTimeout(()=>toast(`😢 ${h.emoji} ${h.name}: seri bozuldu. ${st.icon} ${st.name} bölümü baştan başlıyor.`+(broken.length>1?` (+${broken.length-1} alışkanlık daha)`:'')),600);
  }
}

/* ================= BULUT (Firebase) ================= */
let fb=null,db=null,me=null,cloudState='loading';
const G={};

async function initCloud(){
  try{
    const [appM,authM,fsM]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`)]);
    const app=appM.initializeApp(FB_CFG);
    const auth=authM.getAuth(app);
    fb=fsM;db=fsM.getFirestore(app);
    await new Promise((res,rej)=>{
      const off=authM.onAuthStateChanged(auth,u=>{
        if(u){me=u.uid;off();res()}
        else authM.signInAnonymously(auth).catch(rej);
      },rej);
    });
    cloudState='ok';
    S.groups.forEach(watch);
    handleHash();
    addEventListener('hashchange',handleHash);
    render();
  }catch(e){
    console.error(e);cloudState='err';render();
    if(/g=/.test(location.hash)||S.groups.length)toast('Bulut bağlantısı kurulamadı. Grup alışkanlıkları şu an görünmüyor.');
  }
}
const gRef=gid=>fb.doc(db,'groups',gid);
const mRef=(gid,u)=>fb.doc(db,'groups',gid,'members',u||me);

function watch(gid){
  if(G[gid]||!fb)return;
  const g=G[gid]={doc:null,members:{},loaded:false,unsub:[]};
  g.unsub.push(fb.onSnapshot(gRef(gid),s=>{
    if(!s.exists()){g.missing=true;render();return}
    g.doc=s.data();syncShared(gid);auditGroup(gid);render();
  },e=>{console.error(e);g.err=true;render()}));
  g.unsub.push(fb.onSnapshot(fb.collection(db,'groups',gid,'members'),qs=>{
    const m={};qs.forEach(d=>m[d.id]=d.data());
    g.members=m;
    g.loaded=true;auditGroup(gid);render();
  },e=>{console.error(e);g.err=true;render()}));
}
function unwatch(gid){const g=G[gid];if(!g)return;g.unsub.forEach(f=>f());delete G[gid]}

/* grup kartı için tek tip görünüm */
function groupView(gid){
  const g=G[gid];if(!g||!g.doc||!g.loaded)return null;
  const my=g.members[me]||{};
  const shared=g.doc.mode==='shared';
  const t=today(),y=addDays(t,-1);
  let streak;
  if(shared) streak=(g.doc.lastDate===t||g.doc.lastDate===y)?(g.doc.streak||0):0;
  else streak=(my.lastDate===t||my.lastDate===y)?(my.streak||0):0;
  const src=shared?g.doc:my;
  return {
    id:gid,group:true,shared,name:g.doc.name,emoji:g.doc.emoji,color:g.doc.color,created:g.doc.created,
    stageIdx:src.stageIdx||0,progress:src.progress||0,mastered:!!src.mastered,
    streak,best:shared?(g.doc.best||0):(my.best||0),breaks:src.breaks||0,
    total:my.total||0,history:my.history||[],lastDate:my.lastDate||null,
    members:g.members,joined:!!g.members[me]
  };
}

/* ortak seride bölüm atlama / kırılmayı herkese göster */
function syncShared(gid){
  const g=G[gid];if(!g.doc||g.doc.mode!=='shared')return;
  const lvl=(g.doc.stageIdx||0)+(g.doc.mastered?1:0),br=g.doc.breaks||0;
  const prev=S.gseen[gid];
  S.gseen[gid]={lvl,br};save();
  if(!prev)return;
  if(lvl>prev.lvl){
    const st=STAGES[Math.min(lvl-1,3)];const up=addXP(st.bonus);save();
    ding([523,659,784,1046]);
    setTimeout(()=>{const v=groupView(gid);if(v)celebrate(v,st,up)},500);
  }else if(br>prev.br){
    setTimeout(()=>toast(`💔 ${g.doc.emoji} ${g.doc.name}: biri bir günü kaçırdı, grup bölümü baştan başlıyor.`),500);
  }
}

/* günü kaçırınca kırma (günde bir kez) */
async function auditGroup(gid){
  const g=G[gid];if(!g||!g.doc||!g.loaded||g.audited===today())return;
  g.audited=today();
  const y=addDays(today(),-1),my=g.members[me];
  try{
    if(my&&my.lastDate&&my.lastDate<y){
      const up={};
      if(my.streak)up.streak=0;
      if(g.doc.mode==='solo'&&!my.mastered&&my.progress>0){
        up.progress=0;up.breaks=(my.breaks||0)+1;
        const st=STAGES[my.stageIdx||0];
        setTimeout(()=>toast(`😢 ${g.doc.emoji} ${g.doc.name}: seri bozuldu. ${st.icon} ${st.name} baştan.`),700);
      }
      if(Object.keys(up).length)await fb.updateDoc(mRef(gid),up);
    }
    if(g.doc.mode==='shared'&&my&&!g.doc.mastered&&g.doc.progress>0&&(!g.doc.lastDate||g.doc.lastDate<y)){
      await fb.runTransaction(db,async tx=>{
        const s=await tx.get(gRef(gid));const d=s.data();
        if(d.mastered||!(d.progress>0)||(d.lastDate&&d.lastDate>=y))return;
        tx.update(gRef(gid),{progress:0,streak:0,breaks:(d.breaks||0)+1});
      });
    }
  }catch(e){console.error(e)}
}

async function checkGroup(gid,el){
  const g=G[gid];const t=today();
  if(!g||!g.doc)return;
  const my=g.members[me];if(!my||my.lastDate===t)return;
  const solo=g.doc.mode==='solo';
  if(solo&&my.mastered)return;
  const streak=my.lastDate===addDays(t,-1)?(my.streak||0)+1:1;
  const upd={lastDate:t,streak,best:Math.max(my.best||0,streak),total:(my.total||0)+1,history:[...(my.history||[]),t].slice(-370)};
  let gain,stageDone=false,st;
  if(solo){
    let si=my.stageIdx||0,pr=(my.progress||0)+1;st=STAGES[si];gain=10+5*si;
    if(pr>=st.days){stageDone=true;gain+=st.bonus;if(si>=3){upd.mastered=true;pr=st.days}else{si++;pr=0}}
    upd.stageIdx=si;upd.progress=pr;
  }else gain=10+5*(g.doc.stageIdx||0);
  Object.assign(my,upd);
  const up=addXP(gain);fresh=gid;save();
  const r=el.getBoundingClientRect();
  render();
  floatXP(r.left+r.width/2,r.top,`+${gain} XP`);
  burst(r.left+r.width/2,r.top+r.height/2,36,[g.doc.color,...COLORS]);
  if(stageDone){ding([523,659,784,1046]);setTimeout(()=>{const v=groupView(gid);if(v)celebrate(v,st,up)},450)}
  else{ding([660,880]);if(up)setTimeout(levelUp,350)}
  try{
    await fb.updateDoc(mRef(gid),upd);
    if(!solo)await advanceShared(gid);
  }catch(e){console.error(e);toast('Buluta kaydedilemedi. Bağlantını kontrol edip sayfayı yenile.')}
}

async function advanceShared(gid){
  const t=today(),y=addDays(t,-1);
  const ms=await fb.getDocs(fb.collection(db,'groups',gid,'members'));
  let all=ms.size>0;ms.forEach(d=>{if(d.data().lastDate!==t)all=false});
  if(!all)return;
  const did=await fb.runTransaction(db,async tx=>{
    const s=await tx.get(gRef(gid));const d=s.data();
    if(d.mastered||d.lastDate===t)return false;
    const cont=d.lastDate===y;
    let si=d.stageIdx||0,pr=(cont?(d.progress||0):0)+1;
    const streak=cont?(d.streak||0)+1:1;
    const st=STAGES[si];const upd={lastDate:t,streak,best:Math.max(d.best||0,streak)};
    if(pr>=st.days){if(si>=3){upd.mastered=true;pr=st.days}else{si++;pr=0}}
    upd.stageIdx=si;upd.progress=pr;
    tx.update(gRef(gid),upd);return true;
  });
  if(did)setTimeout(()=>toast('🤝 Herkes bugün tamamladı! Grup serisi +1'),900);
}

async function createGroup(){
  const name=$('#hName').value.trim(),nick=$('#gNick').value.trim();
  if(!name){shake('#hName');return}
  if(!nick){shake('#gNick');return}
  if(cloudState!=='ok'){toast(cloudState==='loading'?'Buluta bağlanıyor, birkaç saniye sonra tekrar dene':'Bulut bağlantısı yok, grup kurulamadı');return}
  const btn=$('#addBtn');btn.disabled=true;btn.textContent='Kuruluyor…';
  const gid=gidGen(),t=today();
  try{
    await fb.setDoc(gRef(gid),{name,emoji:addSel.emoji,color:addSel.color,mode:addSel.mode,createdBy:me,created:t,stageIdx:0,progress:0,lastDate:null,streak:0,best:0,breaks:0,mastered:false});
    await fb.setDoc(mRef(gid),newMember(nick,t));
    S.nick=nick;S.groups.push(gid);save();watch(gid);
    closeModal('addModal');ding([523,784]);
    showShare(gid,name,addSel.emoji);
  }catch(e){console.error(e);toast('Grup kurulamadı: '+(e.code||'bağlantı hatası'))}
  finally{btn.disabled=false;setAddBtn()}
}
const newMember=(nick,t)=>({nick,joined:t,stageIdx:0,progress:0,streak:0,best:0,total:0,breaks:0,history:[],lastDate:null,mastered:false});

const shareLink=gid=>location.origin+location.pathname+'#g='+gid;
function showShare(gid,name,emoji){
  const link=shareLink(gid);
  const msg=`${emoji} "${name}" alışkanlığına benimle başla! Seri'de birlikte takip edelim: ${link}`;
  $('#shareSheet').innerHTML=`
    <button class="x" data-close>✕</button>
    <div class="celebrate"><div class="bigicon">👥</div><h3>Davet linki hazır</h3>
    <p>Bu linki açan herkes, üye olmadan takma adıyla gruba katılabilir.</p></div>
    <div class="linkbox"><input class="inp" id="shareInp" readonly value="${esc(link)}"><button class="btn" id="copyBtn">Kopyala</button></div>
    <a class="btn full" style="display:block;text-align:center;text-decoration:none;background:#25d366;box-shadow:0 5px 0 #179a48" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">WhatsApp'ta paylaş</a>
    <p class="note">Linki bilen herkes katılabilir, sadece güvendiğin kişilerle paylaş.</p>`;
  openModal('shareModal');
  $('#copyBtn').onclick=async()=>{
    try{await navigator.clipboard.writeText(link);$('#copyBtn').textContent='Kopyalandı ✓'}
    catch(e){$('#shareInp').select();document.execCommand('copy');$('#copyBtn').textContent='Kopyalandı ✓'}
  };
}

async function handleHash(){
  const m=location.hash.match(/g=([A-Za-z0-9]{6,24})/);if(!m||!fb)return;
  const gid=m[1];
  history.replaceState(null,'',location.pathname+location.search);
  if(S.groups.includes(gid)){toast('Zaten bu gruptasın 👋');return}
  try{
    const s=await fb.getDoc(gRef(gid));
    if(!s.exists()){toast('Grup bulunamadı, link hatalı olabilir');return}
    const d=s.data();
    const ms=await fb.getDocs(fb.collection(db,'groups',gid,'members'));
    if(ms.docs.some(x=>x.id===me)){S.groups.push(gid);save();watch(gid);toast('Gruba geri döndün 👋');return}
    showJoin(gid,d,ms.docs.map(x=>x.data().nick));
  }catch(e){console.error(e);toast('Grup açılamadı')}
}
function showJoin(gid,d,nicks){
  const mode=d.mode==='shared'?'🤝 Ortak seri: gün ancak herkes yapınca sayılır.':'🏁 Herkes kendi serisi: aynı hedef, ayrı ilerleme.';
  $('#joinSheet').innerHTML=`
    <button class="x" data-close>✕</button>
    <div class="joinhead" style="--hc:${esc(d.color)}"><div class="emoji">${esc(d.emoji)}</div><h3 style="margin:0">${esc(d.name)}</h3>
    <div class="sub">${nicks.length} kişi · ${nicks.slice(0,4).map(esc).join(', ')}${nicks.length>4?'…':''}</div></div>
    <p class="note" style="text-align:center;margin-bottom:6px">${mode}</p>
    <label class="lbl">Takma adın</label>
    <input class="inp" id="jNick" maxlength="20" placeholder="ör. Ayşe" value="${esc(S.nick||'')}" autocomplete="off">
    <button class="btn full" id="joinBtn" style="margin-top:16px">Gruba katıl 🚀</button>`;
  openModal('joinModal');
  $('#joinBtn').onclick=async()=>{
    const nick=$('#jNick').value.trim();if(!nick){shake('#jNick');return}
    $('#joinBtn').disabled=true;$('#joinBtn').textContent='Katılıyor…';
    try{
      await fb.setDoc(mRef(gid),newMember(nick,today()));
      S.nick=nick;S.groups.push(gid);save();watch(gid);
      closeModal('joinModal');ding([523,659,784]);rain(2);
      toast(`${d.emoji} ${d.name} grubuna katıldın!`);
    }catch(e){console.error(e);toast('Katılamadın: '+(e.code||'bağlantı hatası'));$('#joinBtn').disabled=false;$('#joinBtn').textContent='Gruba katıl 🚀'}
  };
}

async function leaveGroup(gid){
  try{await fb.deleteDoc(mRef(gid))}catch(e){console.error(e)}
  unwatch(gid);S.groups=S.groups.filter(x=>x!==gid);delete S.gseen[gid];save();
  closeModal('detailModal');render();toast('Gruptan ayrıldın');
}

/* ---------- çizim ---------- */
function allViews(){
  const v=[...S.habits];
  S.groups.forEach(gid=>{
    const gv=groupView(gid);
    if(gv&&gv.joined)v.push(gv);
    else if(cloudState!=='err')v.push({id:gid,group:true,loading:true,missing:G[gid]&&G[gid].missing});
  });
  return v;
}

function render(){
  const t=today();
  $('#lvl').textContent=S.level;
  $('#xpbar').style.width=Math.min(100,S.xp/need(S.level)*100)+'%';
  $('#xptext').textContent=`${S.xp} / ${need(S.level)} XP · sonraki seviyeye ${need(S.level)-S.xp}`;
  $('#soundBtn').textContent=S.sound===false?'🔇':'🔊';
  const views=allViews();
  const active=views.filter(h=>!h.loading&&!h.mastered);
  const doneN=active.filter(h=>h.lastDate===t).length;
  $('#today').textContent=active.length?`Bugün ${doneN}/${active.length} ✓`:'';
  const m=$('#mascot');
  m.classList.toggle('happy',active.length>0&&doneN===active.length);
  m.classList.toggle('sleepy',active.length>0&&doneN===0);

  const g=$('#grid');
  if(!views.length){g.innerHTML='';$('#empty').hidden=false;return}
  $('#empty').hidden=true;
  g.innerHTML=views.map(h=>h.loading?loadingCard(h):cardHTML(h,t)).join('');
  views.forEach(h=>{if(!h.loading)seen.add(h.id)});
  fresh=null;
}

function loadingCard(h){
  return `<div class="card" style="--hc:#c9bfd6;opacity:.7"><span class="gtag">👥 Grup</span>
    <div class="top"><div class="emoji">${h.missing?'❓':'⏳'}</div><div class="info"><div class="name">${h.missing?'Grup bulunamadı':'Yükleniyor…'}</div><div class="sub">${h.missing?'Bu grup silinmiş olabilir':'Buluttan getiriliyor'}</div></div></div>
    ${h.missing?`<button class="undo" data-forget="${h.id}">listeden kaldır</button>`:''}</div>`;
}

function memberChips(h,t){
  const list=Object.entries(h.members).sort((a,b)=>(a[0]===me?-1:b[0]===me?1:0));
  const shown=list.slice(0,7);
  const chips=shown.map(([u,m])=>`<div class="av ${m.lastDate===t?'ok':''} ${u===me?'me':''}" style="--ac:${nickColor(m.nick)}" title="${esc(m.nick)}${m.lastDate===t?' · bugün tamam':''}">${esc(initial(m.nick))}</div>`).join('');
  const extra=list.length>7?`<div class="av" style="--ac:#b9afc8">+${list.length-7}</div>`:'';
  const doneN=list.filter(([,m])=>m.lastDate===t).length;
  return `<div class="mem">${chips}${extra}<span class="memtxt">${doneN}/${list.length} bugün</span></div>`;
}

function cardHTML(h,t){
  const idx=Math.min(h.stageIdx,3),st=STAGES[idx];
  const doneToday=h.lastDate===t;
  const prog=h.mastered?st.days:h.progress;
  const r=24,C=2*Math.PI*r,off=C*(1-prog/st.days);
  const enter=seen.has(h.id)?'':'enter';
  const chk=h.group?'data-gcheck':'data-check',det=h.group?'data-gdetail':'data-detail';

  const path=STAGES.map((s,i)=>{
    const reached=h.mastered||i<h.stageIdx;
    const cls=reached?'done':(i===h.stageIdx?'cur':'lock');
    const node=`<div class="node ${cls}" style="--sc:${s.color}" title="${s.name} · ${s.days} gün"><span>${cls==='lock'?'🔒':s.icon}</span><small>${s.days}g</small></div>`;
    if(i===0)return node;
    const p=i-1;
    const fill=(h.mastered||p<h.stageIdx)?100:(p===h.stageIdx?prog/STAGES[p].days*100:0);
    return `<div class="seg"><i style="width:${fill}%"></i></div>`+node;
  }).join('');

  let dots='';
  for(let d=0;d<st.days;d++){
    const on=d<prog;
    const nw=on&&fresh===h.id&&d===prog-1;
    dots+=`<i class="dot ${on?'on':''} ${nw?'new':''}"></i>`;
  }

  let action;
  if(h.mastered) action=`<div class="mbadge"><b>👑</b> Efsane! 40 günlük seriyi ${h.shared?'birlikte ':''}bitirdiniz</div>`;
  else if(doneToday){
    action=`<button class="check ok" disabled>✓ ${h.group?'Sen tamam!':'Bugün tamam!'}</button>`;
    if(!h.group&&h.undo)action+=`<button class="undo" data-undo="${h.id}">geri al</button>`;
    if(h.shared){
      const waiting=Object.values(h.members).filter(m=>m.lastDate!==t).map(m=>m.nick);
      action+=`<div class="wait">${waiting.length?`⏳ Bekleniyor: ${waiting.slice(0,3).map(esc).join(', ')}${waiting.length>3?` +${waiting.length-3}`:''}`:'🤝 Herkes tamam! Gün sayıldı'}</div>`;
    }
  }
  else action=`<button class="check" ${chk}="${h.id}">Bugün yaptım! <span>+${10+5*idx} XP</span></button>`;

  const sub=h.mastered?`👑 Ustalaştın${h.rounds?` · ${h.rounds+1}. tur`:''}`:`${st.icon} ${st.name} · <span class="fl">🔥 ${h.streak||0} gün</span>`;
  const tag=h.group?`<span class="gtag">${h.shared?'🤝 Ortak seri':'👥 Grup'}</span>`:'';

  return `<div class="card ${enter} ${doneToday?'done':''} ${h.mastered?'master':''}" style="--hc:${esc(h.color)}">${tag}
    <div class="top" ${det}="${h.id}">
      <div class="emoji">${esc(h.emoji)}</div>
      <div class="info"><div class="name">${esc(h.name)}</div><div class="sub">${sub}</div></div>
      <div class="ring">
        <svg width="58" height="58"><circle class="tr" cx="29" cy="29" r="${r}"/><circle class="pr" cx="29" cy="29" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
        <div class="num">${prog}<small>/${st.days}</small></div>
      </div>
    </div>
    <div class="path">${path}</div>
    <div class="dots">${dots}</div>
    ${h.group?memberChips(h,t):''}
    ${action}
  </div>`;
}

/* ---------- yerel eylemler ---------- */
function check(id,el){
  const h=find(id),t=today();
  if(!h||h.mastered||h.lastDate===t)return;
  const {undo,...snap}=h;
  h.undo={snap:JSON.stringify(snap),xp:S.xp,level:S.level,date:t};
  h.streak=h.lastDate===addDays(t,-1)?(h.streak||0)+1:1;
  h.best=Math.max(h.best||0,h.streak);
  h.total=(h.total||0)+1;
  h.history.push(t);h.lastDate=t;h.progress++;
  const st=STAGES[h.stageIdx];
  let gain=10+5*h.stageIdx,stageDone=false;
  if(h.progress>=st.days){
    stageDone=true;gain+=st.bonus;
    if(h.stageIdx>=STAGES.length-1){h.mastered=true;h.progress=st.days}
    else{h.stageIdx++;h.progress=0}
  }
  const up=addXP(gain);
  fresh=id;save();
  const r=el.getBoundingClientRect();
  render();
  floatXP(r.left+r.width/2,r.top,`+${gain} XP`);
  burst(r.left+r.width/2,r.top+r.height/2,36,[h.color,...COLORS]);
  if(stageDone){ding([523,659,784,1046]);setTimeout(()=>celebrate(h,st,up),450)}
  else{ding([660,880]);if(up)setTimeout(levelUp,350)}
}

function undoCheck(id){
  const h=find(id);
  if(!h||!h.undo||h.undo.date!==today())return;
  const prev=JSON.parse(h.undo.snap);
  S.xp=h.undo.xp;S.level=h.undo.level;
  S.habits[S.habits.indexOf(h)]=prev;
  save();render();toast('Geri alındı ↩️');
}

function addHabit(){
  if(addSel.kind==='group')return createGroup();
  const name=$('#hName').value.trim();
  if(!name){shake('#hName');return}
  S.habits.push({id:uid(),name,emoji:addSel.emoji,color:addSel.color,created:today(),stageIdx:0,progress:0,streak:0,best:0,total:0,breaks:0,history:[],lastDate:null,mastered:false,rounds:0});
  save();closeModal('addModal');render();ding([523,784]);
  toast(`${addSel.emoji} Macera başladı! İlk hedef: 7 gün`);
}
function shake(sel){const e=$(sel);e.focus();e.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:250})}

/* ---------- modallar ---------- */
const addSel={emoji:EMOJIS[0],color:COLORS[0],kind:'solo',mode:'solo'};
function openAdd(){
  addSel.emoji=EMOJIS[0];addSel.color=COLORS[Math.floor(Math.random()*COLORS.length)];
  addSel.kind='solo';addSel.mode='solo';
  $('#hName').value='';$('#gNick').value=S.nick||'';
  drawPickers();drawKind();
  $('#stagesInfo').innerHTML=STAGES.map(s=>`<span>${s.icon} ${s.days} gün</span>`).join('<span style="background:none;padding:6px 0">→</span>');
  openModal('addModal');
  setTimeout(()=>$('#hName').focus(),250);
}
function drawPickers(){
  $('#eGrid').innerHTML=EMOJIS.map(e=>`<button data-e="${e}" class="${e===addSel.emoji?'sel':''}">${e}</button>`).join('');
  $('#cGrid').innerHTML=COLORS.map(c=>`<button data-c="${c}" class="${c===addSel.color?'sel':''}" style="background:${c}"></button>`).join('');
}
function drawKind(){
  document.querySelectorAll('#kindSeg button').forEach(b=>b.classList.toggle('sel',b.dataset.kind===addSel.kind));
  document.querySelectorAll('#modeSel button').forEach(b=>b.classList.toggle('sel',b.dataset.mode===addSel.mode));

}
function setAddBtn(){$('#addBtn').textContent=addSel.kind==='group'?'Grubu kur, davet linki al 👥':'Maceraya başla 🚀'}
function openModal(id){$('#'+id).classList.add('open')}
function closeModal(id){$('#'+id).classList.remove('open')}

function stageRows(h){
  return STAGES.map((s,i)=>{
    const done=h.mastered||i<h.stageIdx,cur=!h.mastered&&i===h.stageIdx;
    const cls=done?'done':cur?'cur':'lock';
    const label=done?'✓ Tamam':cur?`${h.progress}/${s.days}`:'🔒 Kilitli';
    return `<div class="srow ${cls}"><div class="ic">${s.icon}</div><div class="t">${s.name}<small>${s.days} gün üst üste · +${s.bonus} XP</small></div><div class="st">${label}</div></div>`;
  }).join('');
}

function openDetail(id){
  const h=find(id);if(!h)return;
  $('#detailSheet').style.setProperty('--hc',h.color);
  $('#detailSheet').innerHTML=`
    <button class="x" data-close>✕</button>
    <div class="dhead" style="--hc:${h.color}">
      <div class="emoji">${h.emoji}</div>
      <div><h3 style="margin:0">${esc(h.name)}</h3><div class="sub">${h.created} tarihinden beri</div></div>
    </div>
    ${statsHTML(h,'Bozulan seri')}
    <label class="lbl">Bölümler</label>
    <div class="slist" style="--hc:${h.color}">${stageRows(h)}</div>
    <label class="lbl">Son 12 hafta</label>
    ${heat(h)}
    <div class="drow">
      ${h.mastered?`<button class="btn" data-again="${h.id}">🔁 Yeni tur</button>`:''}
      <button class="btn danger" data-del="${h.id}">🗑️ Sil</button>
    </div>`;
  openModal('detailModal');
}
function statsHTML(h,brLabel){
  return `<div class="stats">
      <div class="stat"><b>🔥 ${h.streak||0}</b><small>${h.shared?'Grup serisi':'Mevcut seri'}</small></div>
      <div class="stat"><b>🏆 ${h.best||0}</b><small>En iyi seri</small></div>
      <div class="stat"><b>📅 ${h.total||0}</b><small>Senin toplam günün</small></div>
      <div class="stat"><b>💔 ${h.breaks||0}</b><small>${brLabel}</small></div>
    </div>`;
}

function openGroupDetail(gid){
  const h=groupView(gid);if(!h)return;
  const t=today();
  let mrows;
  const ents=Object.entries(h.members);
  if(h.shared){
    mrows=ents.sort((a,b)=>(b[1].lastDate===t)-(a[1].lastDate===t)).map(([u,m])=>`<div class="mrow"><div class="av" style="--ac:${nickColor(m.nick)}">${esc(initial(m.nick))}</div><div class="nm">${esc(m.nick)}${u===me?' (sen)':''}<small>${m.total||0} gün yaptı</small></div><div>${m.lastDate===t?'✅':'⏳'}</div></div>`).join('');
  }else{
    const score=m=>(m.mastered?4:(m.stageIdx||0))*100+(m.progress||0);
    mrows=ents.sort((a,b)=>score(b[1])-score(a[1])||((b[1].streak||0)-(a[1].streak||0))).map(([u,m],i)=>{
      const st=STAGES[Math.min(m.stageIdx||0,3)];
      const where=m.mastered?'👑 Efsane tamam':`${st.icon} ${st.name} ${m.progress||0}/${st.days}`;
      return `<div class="mrow"><div class="rk">${['🥇','🥈','🥉'][i]||(i+1)}</div><div class="av" style="--ac:${nickColor(m.nick)}">${esc(initial(m.nick))}</div><div class="nm">${esc(m.nick)}${u===me?' (sen)':''}<small>${where} · 🔥 ${m.streak||0}</small></div><div>${m.lastDate===t?'✅':'⏳'}</div></div>`;
    }).join('');
  }
  $('#detailSheet').style.setProperty('--hc',h.color);
  $('#detailSheet').innerHTML=`
    <button class="x" data-close>✕</button>
    <div class="dhead" style="--hc:${esc(h.color)}">
      <div class="emoji">${esc(h.emoji)}</div>
      <div><h3 style="margin:0">${esc(h.name)}</h3><div class="sub">${h.shared?'🤝 Ortak seri':'🏁 Herkes kendi serisi'} · ${ents.length} kişi</div></div>
    </div>
    ${statsHTML(h,h.shared?'Grup serisi bozuldu':'Bozulan seri')}
    <label class="lbl">${h.shared?'Bugün kim yaptı?':'Sıralama'}</label>
    <div class="mlist">${mrows}</div>
    <label class="lbl">${h.shared?'Grup bölümleri':'Senin bölümlerin'}</label>
    <div class="slist" style="--hc:${esc(h.color)}">${stageRows(h)}</div>
    <label class="lbl">Senin son 12 haftan</label>
    ${heat(h)}
    <div class="drow">
      <button class="btn" data-share="${gid}">🔗 Davet et</button>
      <button class="btn danger" data-leave="${gid}">🚪 Ayrıl</button>
    </div>`;
  openModal('detailModal');
}

function heat(h){
  const set=new Set(h.history),t=today();
  const dow=(new Date().getDay()+6)%7;
  const start=addDays(t,-(7*11+dow));
  let c='';
  for(let i=0;i<84;i++){const k=addDays(start,i);c+=`<i class="${set.has(k)?'on':''} ${k>t?'fut':''} ${k===t?'now':''}" title="${k}"></i>`}
  return `<div class="heat" style="--hc:${esc(h.color)}">${c}</div>`;
}

function celebrate(h,st,up){
  let body;
  const who=h.shared?'Grupça ':'';
  if(h.mastered){
    body=`<div class="bigicon">👑</div><h3>EFSANE!</h3>
      <p>${esc(h.emoji)} <b>${esc(h.name)}</b> için ${who.toLowerCase()}tüm bölümleri bitirdin${h.shared?'iz':''}: 7 + 14 + 21 + 40 gün.</p>
      <div class="bonus">+${st.bonus} XP bonus</div>`;
  }else{
    const nx=STAGES[h.stageIdx];
    body=`<div class="bigicon">${st.icon}</div><h3>${who}${st.name} tamamlandı!</h3>
      <p>${esc(h.emoji)} <b>${esc(h.name)}</b>: ${st.days} gün üst üste.</p>
      <div class="bonus">+${st.bonus} XP bonus</div>
      <div class="unlock"><div class="ic">${nx.icon}</div><div><b>Yeni bölüm açıldı: ${nx.name}</b><small>Hedef: ${nx.days} gün üst üste</small></div></div>`;
  }
  if(up)body+=`<p>⬆️ Seviye atladın: <b>${S.level}</b></p>`;
  $('#celebSheet').innerHTML=body+`<button class="btn full" data-close>Devam! 🎉</button>`;
  openModal('celebModal');rain();
}
function levelUp(){toast(`⬆️ Seviye ${S.level}!`);rain(2);ding([784,988,1175])}

/* ---------- efektler ---------- */
let tt;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),3400)}
function floatXP(x,y,txt){const e=document.createElement('div');e.className='xpfloat';e.textContent=txt;e.style.left=x+'px';e.style.top=(y-10)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}

const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function resize(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
function burst(x,y,n=40,colors=COLORS){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,v=3+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,life:60+Math.random()*40,r:5+Math.random()*5,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.35,sq:Math.random()<.55});
  }
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.vy+=.25;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life--;
    cx.save();cx.globalAlpha=Math.min(1,p.life/30);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;
    if(p.sq)cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);else{cx.beginPath();cx.arc(0,0,p.r/2,0,7);cx.fill()}
    cx.restore();
  }
  raf=parts.length?requestAnimationFrame(tick):0;
}
function rain(k=5){for(let i=0;i<k;i++)setTimeout(()=>burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.2+Math.random()*.2),60),i*170)}

let AC;
function ding(notes){
  if(S.sound===false)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    const t0=AC.currentTime;
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),s=t0+i*.09;
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.16,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+.35);
      o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.4);
    });
  }catch(e){}
}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  let b;
  if(b=t.closest('[data-check]'))return check(b.dataset.check,b);
  if(b=t.closest('[data-gcheck]'))return checkGroup(b.dataset.gcheck,b);
  if(b=t.closest('[data-undo]'))return undoCheck(b.dataset.undo);
  if(b=t.closest('[data-detail]'))return openDetail(b.dataset.detail);
  if(b=t.closest('[data-gdetail]'))return openGroupDetail(b.dataset.gdetail);
  if(t.closest('[data-open-add]'))return openAdd();
  if(t.closest('[data-close]'))return t.closest('.modal').classList.remove('open');
  if(t.classList.contains('modal'))return t.classList.remove('open');
  if(b=t.closest('[data-e]')){addSel.emoji=b.dataset.e;return drawPickers()}
  if(b=t.closest('[data-c]')){addSel.color=b.dataset.c;return drawPickers()}
  if(b=t.closest('[data-kind]')){addSel.kind=b.dataset.kind;drawKind();if(addSel.kind==='group'&&!$('#gNick').value)$('#gNick').focus();return}
  if(b=t.closest('[data-mode]')){addSel.mode=b.dataset.mode;return drawKind()}
  if(b=t.closest('[data-share]')){const v=groupView(b.dataset.share);closeModal('detailModal');if(v)showShare(v.id,v.name,v.emoji);return}
  if(b=t.closest('[data-forget]')){const id=b.dataset.forget;unwatch(id);S.groups=S.groups.filter(x=>x!==id);save();render();return}
  if(b=t.closest('[data-leave]')){
    if(b.dataset.armed)leaveGroup(b.dataset.leave);
    else{b.dataset.armed=1;b.textContent='Emin misin? Tekrar bas'}
    return;
  }
  if(b=t.closest('[data-del]')){
    if(b.dataset.armed){S.habits=S.habits.filter(h=>h.id!==b.dataset.del);save();closeModal('detailModal');render();toast('Silindi')}
    else{b.dataset.armed=1;b.textContent='Emin misin? Tekrar bas';}
    return;
  }
  if(b=t.closest('[data-again]')){
    const h=find(b.dataset.again);
    Object.assign(h,{stageIdx:0,progress:0,mastered:false,rounds:(h.rounds||0)+1,streak:h.lastDate===today()?h.streak:0});
    delete h.undo;save();closeModal('detailModal');render();toast('🔁 Yeni tur başladı: 7 gün');
  }
});
$('#addBtn').onclick=addHabit;
$('#hName').addEventListener('keydown',e=>{if(e.key==='Enter')addHabit()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal.open').forEach(m=>m.classList.remove('open'))});

$('#soundBtn').onclick=()=>{S.sound=S.sound===false;save();render();if(S.sound)ding([660])};

let bt;
$('#mascot').onclick=()=>{
  const m=$('#mascot'),b=$('#bubble');
  m.classList.remove('wiggle');void m.offsetWidth;m.classList.add('wiggle');
  setTimeout(()=>m.classList.remove('wiggle'),500);
  b.textContent=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  b.classList.add('show');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('show'),1800);
  ding([880]);
};

$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`seri-yedek-${today()}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!Array.isArray(d.habits))throw 0;
      Object.keys(G).forEach(unwatch);
      S=d;S.groups=S.groups||[];S.gseen=S.gseen||{};save();seen.clear();audit();
      if(fb)S.groups.forEach(watch);
      render();toast('Yedek yüklendi ✅');
    }catch(err){toast('Bu dosya geçerli bir yedek değil')}
  };
  r.readAsText(f);e.target.value='';
};

/* gün değişince kontrol */
let lastDay=today();
function dayTick(){if(today()!==lastDay){lastDay=today();audit();Object.keys(G).forEach(auditGroup);render()}}
setInterval(dayTick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayTick()});

audit();render();initCloud();
